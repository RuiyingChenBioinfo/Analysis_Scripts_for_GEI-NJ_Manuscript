[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gei-nj"
version = "0.2.0.4"
description = "Cell relationship analysis from SNV ratios and sequencing depths using NJ and WLS rooting."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ruiying Chen" },
  { name = "Chao Qin" },
  { name = "Hai-Xi Sun" },
]
keywords = ["single-cell", "SNV", "AnnData", "neighbor-joining", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata",
  "biopython",
  "matplotlib",
  "numpy",
  "pandas",
  "scipy",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/RuiyingChenBioinfo/GEI-NJ"
Repository = "https://github.com/RuiyingChenBioinfo/GEI-NJ"
Issues = "https://github.com/RuiyingChenBioinfo/GEI-NJ/issues"

[tool.setuptools.packages.find]
where = ["src"]
